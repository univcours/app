name: FINGERVERSE Android debug APK
on:
  push:
    branches:
      - fingerverse-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest images ship with Android SDK cmdline tools.
      # Avoid setup-android@v3 (it currently tries to install the removed 'tools' package).
      - name: Install Android platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FINGERVERSE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
