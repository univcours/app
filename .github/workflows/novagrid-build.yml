name: NovaGrid Android beta
on:
  workflow_dispatch:
    inputs:
      publish_internal:
        description: "Upload signed AAB to Google Play INTERNAL TESTING only (requires app created and first upload completed in Play Console)"
        type: boolean
        required: true
        default: false
  push:
    branches: [novagrid-mvp]
    paths:
      - 'novagrid/**'
      - '.github/workflows/novagrid-build.yml'
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    defaults:
      run:
        working-directory: novagrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Test puzzle engine
        run: npm test
      - name: Prepare web assets
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Configure AdMob Android test App ID
        run: npm run android:ads
      - name: Apply NovaGrid cosmic launcher icon
        run: npm run android:brand
      - name: Set Android app display name to NovaGrid
        run: npm run android:name
      - name: Fix legacy Gradle ProGuard configuration
        run: npm run android:gradle-fix

      - name: Verify Play target API and app ID
        run: |
          grep -Eq 'targetSdkVersion\s*=\s*36' android/variables.gradle
          grep -Fq '"appId": "com.novagrid.cosmicpuzzle"' capacitor.config.json
          grep -Fq '"appName": "NovaGrid"' capacitor.config.json
      - name: Give each release bundle a unique Play version code
        run: |
          code=$((10000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode $code/" android/app/build.gradle
          grep -Fq "versionCode $code" android/app/build.gradle
          echo "NovaGrid Android versionCode=$code"
      - name: Check whether a signing key is configured for Internal Testing
        env:
          NOVAGRID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NOVAGRID_UPLOAD_KEYSTORE_BASE64 }}
          NOVAGRID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.NOVAGRID_UPLOAD_KEYSTORE_PASSWORD }}
          NOVAGRID_UPLOAD_KEY_ALIAS: ${{ secrets.NOVAGRID_UPLOAD_KEY_ALIAS }}
          NOVAGRID_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVAGRID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -n "$NOVAGRID_UPLOAD_KEYSTORE_BASE64" && -n "$NOVAGRID_UPLOAD_KEYSTORE_PASSWORD" && -n "$NOVAGRID_UPLOAD_KEY_ALIAS" && -n "$NOVAGRID_UPLOAD_KEY_PASSWORD" ]]; then
            echo "NOVAGRID_SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "Secure signing key available. A signed INTERNAL TESTING AAB will be created."
          else
            echo "NOVAGRID_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "No complete upload key secrets. Only debug APK and UNSIGNED AAB will be created."
          fi
      - name: Build debug APK and unsigned bundle
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew :app:bundleRelease :app:assembleDebug --no-daemon

      - name: Sign the AAB for Play Internal Testing
        if: env.NOVAGRID_SIGNING_READY == 'true'
        env:
          NOVAGRID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NOVAGRID_UPLOAD_KEYSTORE_BASE64 }}
          NOVAGRID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.NOVAGRID_UPLOAD_KEYSTORE_PASSWORD }}
          NOVAGRID_UPLOAD_KEY_ALIAS: ${{ secrets.NOVAGRID_UPLOAD_KEY_ALIAS }}
          NOVAGRID_UPLOAD_KEY_PASSWORD: ${{ secrets.NOVAGRID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/novagrid-upload.jks"
          printf '%s' "$NOVAGRID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          input="android/app/build/outputs/bundle/release/app-release.aab"
          output="android/app/build/outputs/bundle/release/novagrid-play-internal-signed.aab"
          test -s "$input"
          jarsigner -keystore "$keyfile" \
            -storepass:env NOVAGRID_UPLOAD_KEYSTORE_PASSWORD \
            -keypass:env NOVAGRID_UPLOAD_KEY_PASSWORD \
            -signedjar "$output" "$input" "$NOVAGRID_UPLOAD_KEY_ALIAS"
          jarsigner -verify -verbose "$output" | grep -Fq "jar verified."
          rm -f "$keyfile"
          echo "Signed AAB verified. Restricted to Play INTERNAL TESTING until all launch conditions are met."
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/novagrid-upload.jks"
      - name: Upload Play Internal signed AAB
        if: env.NOVAGRID_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: novagrid-play-internal-signed-aab
          path: novagrid/android/app/build/outputs/bundle/release/novagrid-play-internal-signed.aab
          retention-days: 14
          if-no-files-found: error
      - name: Validate Play Console credentials before any upload
        if: github.event_name == 'workflow_dispatch' && inputs.publish_internal == true
        env:
          NOVAGRID_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.NOVAGRID_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ "$NOVAGRID_SIGNING_READY" != "true" ]]; then
            echo "::error::Four signing secrets are required; no signed AAB was generated."
            exit 1
          fi
          if [[ -z "$NOVAGRID_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::GitHub Actions secret NOVAGRID_PLAY_SERVICE_ACCOUNT_JSON is missing."
            exit 1
          fi
          test -s android/app/build/outputs/bundle/release/novagrid-play-internal-signed.aab
          echo "Ready for the INTERNAL test track only (not public production)."
      - name: Upload signed bundle to Google Play INTERNAL TESTING
        if: github.event_name == 'workflow_dispatch' && inputs.publish_internal == true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.NOVAGRID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.novagrid.cosmicpuzzle
          releaseFiles: novagrid/android/app/build/outputs/bundle/release/novagrid-play-internal-signed.aab
          tracks: internal
          status: completed
          changesNotSentForReview: false
      - uses: actions/upload-artifact@v4
        with:
          name: novagrid-debug-apk
          path: novagrid/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: novagrid-unsigned-aab
          path: novagrid/android/app/build/outputs/bundle/release/*.aab
      - name: Assemble complete Android Studio project
        run: |
          mkdir -p android-studio-export/node_modules/@capacitor/android
          rsync -a --exclude='build' --exclude='.gradle' --exclude='local.properties' android/ android-studio-export/android/
          rsync -a node_modules/@capacitor/android/ android-studio-export/node_modules/@capacitor/android/
          cp package.json capacitor.config.json android-studio-export/
          cp -r web android-studio-export/
          test -f android-studio-export/android/settings.gradle
          test -f android-studio-export/node_modules/@capacitor/android/capacitor/build.gradle
      - name: Upload complete Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: novagrid-android-studio
          path: novagrid/android-studio-export/
          retention-days: 30
