name: RookVanta Tests
on:
  push:
    branches: [rookvanta-mvp]
    paths:
      - 'rookvanta/**'
      - '.github/workflows/rookvanta-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rookvanta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
