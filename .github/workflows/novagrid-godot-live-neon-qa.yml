name: NovaGrid Live Puzzle and Blockfall Neon Visual QA
on:
  push:
    branches: [novagrid-godot-admob-test-20261107]
    paths:
      - "novagrid-godot/scripts/Main.gd"
      - "novagrid-godot/shaders/**"
      - "novagrid-godot/tests/capture.gd"
      - "novagrid-godot/tests/test_layout.gd"
      - "novagrid-godot/tests/test_touch.gd"
      - ".github/workflows/novagrid-godot-live-neon-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cosmic-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1 (pinned)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m755 /tmp/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import and parse actual 3D Candy gameplay UI
        run: |
          set -euo pipefail
          godot --headless --editor --path novagrid-godot --quit 2>&1 | tee /tmp/neon-import.log
          godot --headless --path novagrid-godot --check-only --script res://scripts/Main.gd 2>&1 | tee /tmp/neon-parse.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error' /tmp/neon-import.log /tmp/neon-parse.log; then exit 1; fi
      - name: Ensure real puzzle and falling controls, 3 screen sizes and native ad dock
        run: |
          set -euo pipefail
          godot --headless --audio-driver Dummy --path novagrid-godot --script res://tests/test_layout.gd 2>&1 | tee /tmp/neon-layout.log
          grep -F 'ALL NOVAGRID RESPONSIVE LAYOUT AND BANNER-DOCK TESTS PASSED' /tmp/neon-layout.log
          godot --headless --audio-driver Dummy --path novagrid-godot --script res://tests/test_touch.gd 2>&1 | tee /tmp/neon-touch.log
          grep -F 'ALL NOVAGRID TOUCH CONTROLS PASSED' /tmp/neon-touch.log
      - name: Capture REAL gameplay in both modes (432 x 960)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y xvfb xauth >/dev/null
          timeout 130s xvfb-run -a -s "-screen 0 432x960x24" godot --path novagrid-godot --script res://tests/capture.gd 2>&1 | tee /tmp/neon-capture.log
          grep -F 'REAL GODOT SCREENSHOTS SAVED' /tmp/neon-capture.log
          for f in novagrid-real-puzzle.png novagrid-real-blockfall.png novagrid-real-glass-fx.png; do
            test -s "novagrid-godot/build/$f"
            file "novagrid-godot/build/$f"
          done
      - name: Upload REAL Godot screenshots, not concept images
        uses: actions/upload-artifact@v4
        with:
          name: NovaGrid-Live-Cosmic-Candy-Puzzle-Blockfall-432x960
          path: |
            novagrid-godot/build/novagrid-real-puzzle.png
            novagrid-godot/build/novagrid-real-blockfall.png
            novagrid-godot/build/novagrid-real-glass-fx.png
          if-no-files-found: error
          retention-days: 21
      - name: Upload visual QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaGrid-Live-Neon-Visual-Logs
          path: /tmp/neon-*.log
          if-no-files-found: ignore
