name: NovaGrid Godot Welcome Visual QA
on:
  push:
    branches: [novagrid-godot-admob-test-20261107]
    paths:
      - 'novagrid-godot/scripts/Welcome.gd'
      - 'novagrid-godot/tests/capture_welcome.gd'
      - 'novagrid-godot/tests/test_open_source.gd'
      - '.github/workflows/novagrid-godot-welcome-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-welcome-render:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1 engine
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import Godot assets and scripts
        run: |
          set -euo pipefail
          godot --headless --editor --path novagrid-godot --quit 2>&1 | tee /tmp/godot-welcome-import.log
          godot --headless --path novagrid-godot --check-only --script res://scripts/Welcome.gd 2>&1 | tee /tmp/godot-welcome-parse.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error' /tmp/godot-welcome-import.log /tmp/godot-welcome-parse.log; then exit 1; fi
      - name: Native game menu and small-phone layout tests
        run: |
          set -euo pipefail
          godot --headless --audio-driver Dummy --path novagrid-godot --script res://tests/test_open_source.gd 2>&1 | tee /tmp/godot-welcome-test.log
          grep -F 'ALL NOVAGRID OPEN SOURCE REBUILD TESTS PASSED' /tmp/godot-welcome-test.log
          godot --headless --audio-driver Dummy --path novagrid-godot --script res://tests/test_layout.gd 2>&1 | tee /tmp/godot-welcome-layout.log
          grep -F 'ALL NOVAGRID RESPONSIVE LAYOUT AND BANNER-DOCK TESTS PASSED' /tmp/godot-welcome-layout.log
      - name: Capture ACTUAL new Godot welcome screen
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth >/dev/null
          xvfb-run -a -s "-screen 0 432x960x24" godot --path novagrid-godot --script res://tests/capture_welcome.gd 2>&1 | tee /tmp/godot-welcome-capture.log
          grep -F 'REAL NOVAGRID OPEN SOURCE HOME SCREENSHOT SAVED' /tmp/godot-welcome-capture.log
          file novagrid-godot/build/novagrid-real-welcome.png
          test -s novagrid-godot/build/novagrid-real-welcome.png
      - uses: actions/upload-artifact@v4
        with:
          name: NovaGrid-Godot-Premium-Welcome-Real-432x960
          path: novagrid-godot/build/novagrid-real-welcome.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload logs if something fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NovaGrid-Godot-Premium-Welcome-QA-Logs
          path: /tmp/godot-welcome-*.log
          if-no-files-found: ignore
