name: NovaGrid Continuous Play QA
on:
  push:
    branches: [novagrid-continuous-play]
  workflow_dispatch:
jobs:
  web-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        working-directory: novagrid
        run: npm install --no-audit --no-fund
      - name: Verify gameplay and interface tests
        working-directory: novagrid
        run: npm test
      - name: Build NovaGrid web assets (Google test ads only)
        working-directory: novagrid
        env:
          ADMOB_LIVE_ADS: 'false'
        run: npm run build

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: novagrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Make Android project with demo ads
        env:
          ADMOB_LIVE_ADS: 'false'
        run: |
          npm run build
          npx cap add android
          npm run android:sync
      - name: Assemble safe side-by-side test APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Confirm test application ID
        run: |
          set -euo pipefail
          tool="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$tool" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.novagrid.cosmicpuzzle.candytest'"
      - uses: actions/upload-artifact@v4
        with:
          name: novagrid-continuous-glass-debug-test-ads
          path: novagrid/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
