name: NovaGrid Neon Duo QA
on:
  push:
    branches: [novagrid-neon-duo]
    paths:
      - 'novagrid/**'
      - '.github/workflows/novagrid-neon-duo.yml'
  workflow_dispatch:
jobs:
  test-and-build-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: novagrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test both game modes and progression
        run: npm test
      - name: Build production-compatible web assets with TEST ads
        env:
          ADMOB_LIVE_ADS: 'false'
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web assets and isolate beta debug package
        env:
          ADMOB_LIVE_ADS: 'false'
        run: npm run android:sync
      - name: Build side-by-side Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Confirm app ID is not the Play Store package
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          tool="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$tool"
          "$tool" dump badging "$apk" | grep -F "package: name='com.novagrid.cosmicpuzzle.candytest'"
          echo 'Original Google Play installation and game data are not touched.'
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: novagrid-neon-duo-TEST-apk
          path: novagrid/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
