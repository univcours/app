name: NovaGrid Godot Native QA
on:
  push:
    branches: [novagrid-godot-rebuild, novagrid-open-source-rebuild]
    paths:
      - 'novagrid-godot/**'
      - '.github/workflows/novagrid-godot.yml'
  workflow_dispatch:
jobs:
  native-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot 4.5.1 engine
        run: |
          set -euxo pipefail
          curl --retry 3 -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Parse audio, game rules and main UI directly
        run: |
          set -euo pipefail
          for script in Audio.gd Puzzle.gd Falling.gd Progression.gd Candy3D.gd Visuals.gd GameSession.gd WallKicks.gd Welcome.gd Main.gd configure_android_editor.gd; do
            godot --headless --path novagrid-godot --check-only --script "res://scripts/$script"
          done
      - name: Check Windows PowerShell helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("novagrid-godot/scripts/update-build-install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "NOVAGRID WINDOWS HELPER SYNTAX VALID"
      - name: Import project and parse all game scripts
        run: |
          set -euo pipefail
          godot --headless --editor --path novagrid-godot --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error' /tmp/import.log; then exit 1; fi
      - name: Real 3D candy mesh and PBR rendering checks
        run: |
          set -euo pipefail
          godot --headless --path novagrid-godot --script res://tests/test_candy3d.gd 2>&1 | tee /tmp/candy3d.log
          grep -F 'ALL NOVAGRID REAL 3D CANDY ASSET TESTS PASSED' /tmp/candy3d.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error' /tmp/candy3d.log; then exit 1; fi
      - name: Native gameplay engine tests
        run: |
          set -euo pipefail
          godot --headless --path novagrid-godot --script res://tests/test_game.gd 2>&1 | tee /tmp/test.log
          grep -F 'ALL NOVAGRID GODOT RULE TESTS PASSED' /tmp/test.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error' /tmp/test.log; then exit 1; fi
      - name: Progression integrity and daily mission tests
        run: |
          set -euo pipefail
          godot --headless --path novagrid-godot --script res://tests/test_progression.gd 2>&1 | tee /tmp/progression.log
          grep -F 'ALL NOVAGRID METAGAME TESTS PASSED' /tmp/progression.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error' /tmp/progression.log; then exit 1; fi
      - name: Real touch and swipe controls QA
        run: |
          set -euo pipefail
          godot --headless --path novagrid-godot --script res://tests/test_touch.gd 2>&1 | tee /tmp/touch.log
          grep -F 'ALL NOVAGRID TOUCH CONTROLS PASSED' /tmp/touch.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error' /tmp/touch.log; then exit 1; fi
      - name: MIT-inspired rotation, lock delay and native launcher tests
        run: |
          set -euo pipefail
          godot --headless --path novagrid-godot --script res://tests/test_open_source.gd 2>&1 | tee /tmp/open-source.log
          grep -F 'ALL NOVAGRID OPEN SOURCE REBUILD TESTS PASSED' /tmp/open-source.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error' /tmp/open-source.log; then exit 1; fi
      - name: Launch actual main scene headlessly
        run: |
          set -euo pipefail
          timeout 12s godot --headless --path novagrid-godot --quit-after 90 2>&1 | tee /tmp/runtime.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error' /tmp/runtime.log; then exit 1; fi
      - name: Capture ACTUAL Godot game renders
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth >/dev/null
          xvfb-run -a -s "-screen 0 432x960x24" godot --path novagrid-godot --script res://tests/capture.gd 2>&1 | tee /tmp/visual.log
          grep -F 'REAL GODOT SCREENSHOTS SAVED' /tmp/visual.log
          file novagrid-godot/build/novagrid-real-*.png
      - name: Capture genuine Godot Galaxy launch screen
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 432x960x24" godot --path novagrid-godot --script res://tests/capture_welcome.gd 2>&1 | tee /tmp/welcome.log
          grep -F 'REAL NOVAGRID OPEN SOURCE HOME SCREENSHOT SAVED' /tmp/welcome.log
          test -s novagrid-godot/build/novagrid-real-welcome.png
      - name: Upload true Godot screenshots
        uses: actions/upload-artifact@v4
        with:
          name: novagrid-godot-real-play-screens
          path: novagrid-godot/build/novagrid-real-*.png
          retention-days: 14
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK for export
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" || true
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Verify Godot Android editor SDK setup helper
        run: |
          set -euo pipefail
          NOVAGRID_ANDROID_SDK="$ANDROID_HOME" NOVAGRID_JAVA_SDK="$JAVA_HOME" godot --headless --editor --path novagrid-godot --script res://scripts/configure_android_editor.gd 2>&1 | tee /tmp/android-config.log
          grep -F 'NOVAGRID_ANDROID_EDITOR_CONFIGURED' /tmp/android-config.log
      - name: Download Godot matching Android export templates
        run: |
          set -euo pipefail
          curl --retry 3 -fL -o /tmp/godot-templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p /tmp/godot-template-extract "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-template-extract
          cp -a /tmp/godot-template-extract/templates/. "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          ls -lh "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"
      - name: Create isolated local debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/novagrid-preview-debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 4000 -dname "CN=NovaGrid Preview,O=Local QA,C=US"
      - name: Export real Godot Android preview APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/novagrid-godot/.local-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cp "$HOME/.android/novagrid-preview-debug.keystore" "novagrid-godot/.local-debug.keystore"
          mkdir -p novagrid-godot/build
          godot --headless --path novagrid-godot --export-debug "Android Preview" "build/NovaGrid-Godot-Preview.apk" 2>&1 | tee /tmp/android-export.log
          test -s novagrid-godot/build/NovaGrid-Godot-Preview.apk
          tool="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$tool" dump badging novagrid-godot/build/NovaGrid-Godot-Preview.apk | grep -F "package: name='com.novagrid.cosmicpuzzle.godotpreview'"
          rm -f novagrid-godot/.local-debug.keystore
      - name: Upload isolated Android preview
        uses: actions/upload-artifact@v4
        with:
          name: novagrid-godot-native-preview-apk
          path: novagrid-godot/build/NovaGrid-Godot-Preview.apk
          retention-days: 14
          if-no-files-found: error
      - name: Keep test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novagrid-godot-native-qa-logs
          path: |
            /tmp/import.log
            /tmp/test.log
            /tmp/runtime.log
            /tmp/progression.log
            /tmp/touch.log
            /tmp/open-source.log
            /tmp/candy3d.log
            /tmp/welcome.log
          if-no-files-found: ignore
